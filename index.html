
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Creative Cafe</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial}
header{text-align:center;padding:25px 10px;border-bottom:1px solid #b58b35}
h1{color:#f5d27a;margin:0}
header p{color:white}
main{max-width:700px;margin:auto;padding:15px}
h2{color:#e8bd59;border-bottom:1px solid #806020;padding-bottom:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid #333}
.price{color:#f5d27a;margin-top:5px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:7px;padding:10px 14px;background:#c9a45d;color:#111;font-weight:bold}
select{background:#111;color:#f5d27a;border:1px solid #806020;border-radius:6px;padding:8px}
.panel{background:#171717;border:1px solid #806020;border-radius:12px;padding:15px;margin-top:20px}
input{width:100%;padding:12px;background:#111;color:white;border:1px solid #806020;border-radius:7px;font-size:16px}
label{display:block;margin:12px 0 6px;color:#e8d7b2}
.line{display:flex;justify-content:space-between;gap:8px;padding:7px 0}
.total{font-size:22px;color:#f5d27a}
.submit{width:100%;margin-top:15px;padding:14px}
#message{color:#f5d27a;white-space:pre-wrap}
:root{scroll-behavior:smooth;scroll-padding-top:112px}
header{position:relative;background:radial-gradient(ellipse at 50% 12%,#241b0d 0%,#080808 68%);padding:22px 12px 20px;border-bottom:1px solid #8c682e}
header h1{letter-spacing:2px;font-size:clamp(25px,6vw,36px)}
.brand-mark{display:block;width:min(330px,84vw);height:min(330px,84vw);object-fit:contain;object-position:center;background:transparent;border-radius:50%;margin:0 auto 10px;opacity:1;filter:brightness(1.07) contrast(1.13);image-rendering:auto;border:0;box-shadow:none}
header p{color:#d9c69c;margin-bottom:0}
.brand-header .brand-topline{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto 8px;color:#c9a45d;font-size:10px;letter-spacing:2px;font-weight:bold}.brand-header h1{font-size:clamp(23px,6vw,34px);letter-spacing:2px;margin:5px 0}.brand-tagline{font-size:clamp(16px,4vw,20px);margin:6px 0 12px!important;color:#e5d2a5!important}.brand-bottomline{color:#a98a52;font-size:10px;letter-spacing:2px;margin-top:8px}.menu-title{text-align:center;margin:12px auto 8px}.menu-title span{display:inline-block;padding:8px 34px;border:1px solid #bd9142;border-radius:30px;color:#f5d27a;font-family:Georgia,serif;font-size:clamp(25px,7vw,36px);font-style:italic;letter-spacing:1px;box-shadow:0 0 12px rgba(189,145,66,.12)}
#categoryNav{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:11px 12px;background:rgba(8,8,8,.96);border-bottom:1px solid #806020;scrollbar-width:none}
#categoryNav a{flex:0 0 auto;text-decoration:none;color:#f5d27a;border:1px solid #806020;border-radius:20px;padding:9px 13px;font-size:13px;font-weight:bold;white-space:nowrap}
#categoryNav a:active,#categoryNav a:focus{background:#c9a45d;color:#111}
main{padding:12px;max-width:820px}
.menu-section{margin:22px 0 30px;scroll-margin-top:74px}
.category-hero{height:150px;border-radius:15px;overflow:hidden;position:relative;background:linear-gradient(120deg,#392b17,#100e0a 65%,#705021);border:1px solid #9b793c;margin-bottom:14px}
.category-hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;background:#080808}.category-hero .hero-gallery{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.category-hero .hero-gallery img{width:100%;height:100%;min-width:0;object-fit:cover;display:block;opacity:.78}.category-hero h2{z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,0));padding:5px 12px 5px 0}
.category-hero h2{position:absolute;left:16px;bottom:8px;margin:0;color:#fff;text-shadow:0 2px 8px #000;border:0;font-size:23px}
.item{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid #30291e}
.item-photo{width:104px;height:104px;object-fit:cover;border-radius:12px;background:linear-gradient(135deg,#302515,#111);border:1px solid #5c4828}
.item-info{min-width:0}.item-info strong{font-size:15px;line-height:1.35;color:#fff}
.item-description{font-size:12px;color:#bdb3a0;margin-top:5px;line-height:1.4}
.price{font-weight:bold;margin-top:7px}
.controls{justify-content:flex-end;gap:7px}.controls button{min-width:34px;padding:8px 11px}
@media(max-width:390px){.item{grid-template-columns:82px minmax(0,1fr);gap:10px}.item-photo{width:82px;height:90px}.controls{gap:5px}.controls button{padding:7px 9px}}
</style>
</head>
<body>
<header>
<img class="brand-mark" src="/logo_clean.jpg" alt="The Creative Cafe Chocolate logo">
<h1>THE CREATIVE CAFE</h1>
<p>સુકૂન का दूसरा नाम — कॉफी।</p>
</header>
<main>
<nav id="categoryNav" aria-label="Menu categories"></nav><div id="menu">મેનૂ લોડ થઈ રહ્યું છે...</div>
<section class="panel">
<h2>તમારો ઓર્ડર</h2>
<div id="cart">હજુ કોઈ વસ્તુ પસંદ કરી નથી.</div>
<div class="line"><strong>કુલ બિલ</strong><strong class="total" id="total">₹0</strong></div>
<label>ગ્રાહકનું નામ *</label><input id="customerName" placeholder="તમારું નામ">
<label>મોબાઇલ નંબર *</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10 અંકનો નંબર">
<button class="submit" id="placeOrder">ઓર્ડર કન્ફર્મ કરો</button><div id="message"></div>
</section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getFirestore,collection,onSnapshot,doc,runTransaction,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAkCeioTxKKnFPVHUfRXcCQmH88SwyB9jE",authDomain:"the-creativit-cafe-manu.firebaseapp.com",projectId:"the-creativit-cafe-manu",storageBucket:"the-creativit-cafe-manu.firebasestorage.app",messagingSenderId:"806496134143",appId:"1:806496134143:web:750eaea05f4565d7bb3dca",measurementId:"G-M7H7506ZHE"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),menu=document.getElementById("menu"),categoryNav=document.getElementById("categoryNav"),cart=document.getElementById("cart"),quantities={},products={};let busy=false;
function hasSizes(p){return p.PriceSmall!==undefined&&p.PriceLarge!==undefined&&Number.isFinite(Number(p.PriceSmall))&&Number.isFinite(Number(p.PriceLarge))}
function itemPrice(p,size){return hasSizes(p)?Number(size==="Large"?p.PriceLarge:p.PriceSmall):Number(p.Price)}
function renderCart(){cart.innerHTML="";let total=0,count=0;Object.keys(quantities).forEach(key=>{const q=quantities[key],parts=key.split("::"),id=parts[0],size=parts[1]||"";if(q<=0||!products[id])return;const p=products[id],price=itemPrice(p,size);total+=price*q;count+=q;const row=document.createElement("div");row.className="line";row.textContent=(p.Name||"")+(size?" ("+size+")":"")+" × "+q+" = ₹"+(price*q);cart.append(row)});if(count===0)cart.textContent="હજુ કોઈ વસ્તુ પસંદ કરી નથી.";document.getElementById("total").textContent="₹"+total;return{total,count}}
function changeQty(id,change,size){const key=id+"::"+(size||"");quantities[key]=Math.max(0,(quantities[key]||0)+change);renderCart()}
onSnapshot(collection(db,"menuItems"),snapshot=>{
  menu.innerHTML="";
  categoryNav.innerHTML="";
  Object.keys(products).forEach(k=>delete products[k]);
  const groups={};
  snapshot.docs.forEach(itemDoc=>{
    const p={id:itemDoc.id,...itemDoc.data()};
    if(p.Available===false)return;
    products[p.id]=p;
    const cat=p.Category||"Menu";
    if(!groups[cat])groups[cat]=[];
    groups[cat].push(p);
  });
  Object.keys(groups).forEach((category,index)=>{
    const navLink=document.createElement("a");
    navLink.href="#category-"+index;
    navLink.textContent=category;
    categoryNav.append(navLink);
    const section=document.createElement("section");
    section.className="menu-section";
    section.id="category-"+index;
    const hero=document.createElement("div");
    hero.className="category-hero";
    const photos=groups[category].map(p=>p.CategoryImageURL||p.ImageURL).filter(Boolean);
    const defaults=[
      "photo-1442512595331-e89e73853f31",
      "photo-1509042239860-f550ce710b93",
      "photo-1495474472287-4d71bcdd2085",
      "photo-1514432324607-a09d9b4aefdd"
    ].map(id=>"https://images.unsplash.com/"+id+"?auto=format&fit=crop&w=600&q=80");
    const gallery=document.createElement("div");
    gallery.className="hero-gallery";
    const uniquePhotos=[...new Set([...photos,...defaults])].slice(0,4);
    uniquePhotos.forEach((url,i)=>{
      const img=document.createElement("img");
      img.src=url;
      img.alt=category+" photo "+(i+1);
      img.loading="lazy";
      gallery.append(img);
    });
    hero.append(gallery);
    const heading=document.createElement("h2");
    heading.textContent=category;
    hero.append(heading);
    section.append(hero);
    groups[category].forEach(p=>{
      const row=document.createElement("div");
      row.className="item";
      const photo=document.createElement("img");
      photo.className="item-photo";
      photo.alt=p.Name||"Menu item";
      photo.loading="lazy";
      if(p.ImageURL){photo.src=p.ImageURL}else{photo.style.display="none";row.style.gridTemplateColumns="minmax(0,1fr)"}
      const info=document.createElement("div");
      info.className="item-info";
      const name=document.createElement("strong");
      name.textContent=p.Name||"";
      const description=document.createElement("div");
      description.className="item-description";
      description.textContent=p.Description||"The Creative Cafe ની ખાસ પસંદગી.";
      const price=document.createElement("div");
      price.className="price";
      const controls=document.createElement("div");
      controls.className="controls";
      let sizeSelect=null;
      if(hasSizes(p)){
        price.textContent="Small ₹"+p.PriceSmall+" | Large ₹"+p.PriceLarge;
        sizeSelect=document.createElement("select");
        sizeSelect.innerHTML='<option value="Small">Small</option><option value="Large">Large</option>';
        controls.append(sizeSelect);
      }else{price.textContent="₹"+p.Price}
      info.append(name,description,price);
      const currentSize=()=>sizeSelect?sizeSelect.value:"";
      const minus=document.createElement("button");
      minus.textContent="−";
      const number=document.createElement("span");
      const updateNumber=()=>{number.textContent=quantities[p.id+"::"+currentSize()]||0};
      minus.onclick=()=>{changeQty(p.id,-1,currentSize());updateNumber()};
      const plus=document.createElement("button");
      plus.textContent="+";
      plus.onclick=()=>{changeQty(p.id,1,currentSize());updateNumber()};
      if(sizeSelect)sizeSelect.onchange=updateNumber;
      updateNumber();
      controls.append(minus,number,plus);
      row.append(photo,info,controls);
      section.append(row);
    });
    menu.append(section);
  });
  renderCart();
},error=>{
  menu.textContent="મેનૂ લોડ થયું નથી. Firebase Rules તપાસો.";
  console.error(error);
});
document.getElementById("placeOrder").onclick=async()=>{if(busy)return;const name=document.getElementById("customerName").value.trim(),phone=document.getElementById("mobile").value.replace(/\D/g,""),{total,count}=renderCart(),message=document.getElementById("message");if(!count){message.textContent="પહેલા વસ્તુ પસંદ કરો.";return}if(!name){message.textContent="નામ લખો.";return}if(!/^\d{10}$/.test(phone)){message.textContent="યોગ્ય 10 અંકનો મોબાઇલ નંબર લખો.";return}const items=Object.keys(quantities).filter(key=>quantities[key]>0&&products[key.split("::")[0]]).map(key=>{const parts=key.split("::"),id=parts[0],size=parts[1]||"",p=products[id],price=itemPrice(p,size);return{menuItemId:id,name:p.Name,category:p.Category||"",...(size?{size}:{}),price,quantity:quantities[key],lineTotal:price*quantities[key]}});busy=true;const btn=document.getElementById("placeOrder");btn.disabled=true;message.textContent="ઓર્ડર સાચવાઈ રહ્યો છે...";try{const ref=doc(collection(db,"orders")),counterRef=doc(db,"settings","orderCounter");const tokenNumber=await runTransaction(db,async transaction=>{const counterSnap=await transaction.get(counterRef),nextNumber=(counterSnap.exists()?Number(counterSnap.data().lastNumber)||0:0)+1;transaction.set(counterRef,{lastNumber:nextNumber},{merge:true});transaction.set(ref,{tokenNumber:nextNumber,customerName:name,mobile:phone,items,total,status:"New Order",printStatus:"Pending",createdAt:serverTimestamp()});return nextNumber});const details=items.map(x=>x.name+(x.size?" ("+x.size+")":"")+" × "+x.quantity+" = ₹"+x.lineTotal).join("\n"),text="THE CREATIVE CAFE ☕"+"\\nટોકન #"+tokenNumber+"\\nનામ: "+name+"\\nમોબાઇલ: "+phone+"\\n"+details+"\\nકુલ બિલ: ₹"+total;window.location.href="https://wa.me/917202927420?text="+encodeURIComponent(text)}catch(error){message.textContent="ઓર્ડર સાચવાયો નથી: "+error.message;console.error(error)}finally{busy=false;btn.disabled=false}};
</script>
</body>
</html>
