const items=raw.split("\n").map(line=>{
 const [Category,Name,priceText]=line.split("|");
 if(priceText.includes("/")){
  const [small,large]=priceText.split("/").map(Number);
  return {Category,Name,Price:small,PriceSmall:small,PriceLarge:large};
 }
 return {Category,Name,Price:Number(priceText)};
});

document.getElementById("login").addEventListener("click",async()=>{
 status.textContent="Login થઈ રહ્યું છે...";
 try{
  await signInWithEmailAndPassword(auth,
   document.getElementById("email").value.trim(),
   document.getElementById("password").value);
  status.textContent="Login સફળ. હવે Import બટન દબાવો.";
 }catch(e){status.textContent="Login ભૂલ: "+e.message;}
});

onAuthStateChanged(auth,user=>{
 importBtn.disabled=!user;
});

importBtn.addEventListener("click",async()=>{
 if(!auth.currentUser){status.textContent="પહેલા Login કરો.";return;}
 importBtn.disabled=true;
 status.textContent="મેનૂ તપાસી રહ્યું છે...";
 try{
  const ref=collection(db,"menuItems");
  const snap=await getDocs(ref);
  const existing=new Map();
  snap.forEach(d=>{
   const v=d.data();
   existing.set((v.Category||"").trim().toLowerCase()+"||"+(v.Name||"").trim().toLowerCase(),d);
  });

  const batch=writeBatch(db);
  let added=0,updated=0;

  for(const item of items){
   const key=item.Category.toLowerCase()+"||"+item.Name.toLowerCase();
   const old=existing.get(key);
   if(old){
    batch.set(doc(db,"menuItems",old.id),item,{merge:true});
    updated++;
   }else{
    const newRef=doc(ref);
    batch.set(newRef,{...item,Available:true});
    added++;
   }
  }

  await batch.commit();
  status.textContent=
   "સફળતાપૂર્વક Import પૂર્ણ થયું!\n"+
   "કુલ યાદી: "+items.length+
   "\nનવી ઉમેરેલી: "+added+
   "\nજૂની અપડેટ: "+updated+
   "\nજૂની અન્ય વસ્તુઓ ડિલીટ કરી નથી.";
 }catch(e){
  status.textContent="Import થયું નથી:\n"+e.message+
   "\nFirestore Rules અથવા Admin Login તપાસો.";
 }
 importBtn.disabled=false;
});
